      .layer { stroke: #b8cce0; stroke-width: 1.5; rx: 16; }
      .node { fill: #ffffff; stroke: #244f8f; stroke-width: 2; rx: 10; }
      .arrow { fill: none; stroke: #244f8f; stroke-width: 2.4; marker-end: url(#arrowhead); }
      .thin-arrow { fill: none; stroke: #244f8f; stroke-width: 2; marker-end: url(#arrowhead); }
      .feedback { fill: none; stroke: #244f8f; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrowhead); }
